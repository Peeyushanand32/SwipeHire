version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: swipehire_db
    restart: always
    environment:
      POSTGRES_USER: swipehire
      POSTGRES_PASSWORD: swipehire_secure_password_2026
      POSTGRES_DB: swipehire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swipehire_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://swipehire:swipehire_secure_password_2026@postgres:5432/swipehire_db?schema=public
      - JWT_SECRET=swipehire_jwt_secret_key_2026_antigravity
    depends_on:
      - postgres

volumes:
  postgres_data:
