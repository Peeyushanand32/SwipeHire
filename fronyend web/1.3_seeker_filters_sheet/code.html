<script>
        // Simple micro-interaction for the chips
        document.querySelectorAll('button.rounded-full').forEach(chip => {
            chip.addEventListener('click', () => {
                if(chip.classList.contains('bg-primary')) {
                    chip.classList.replace('bg-primary', 'bg-surface-container-high');
                    chip.classList.replace('text-on-primary', 'text-on-surface-variant');
                } else if(chip.classList.contains('bg-surface-container-high')) {
                    chip.classList.replace('bg-surface-container-high', 'bg-primary');
                    chip.classList.replace('text-on-surface-variant', 'text-on-primary');
                }
            });
        });

        // Pull to dismiss logic (Visual only)
        let touchstartY = 0;
        const sheet = document.getElementById('bottomSheet');
        
        sheet.addEventListener('touchstart', e => {
            touchstartY = e.changedTouches[0].screenY;
        });

        sheet.addEventListener('touchmove', e => {
            const touchY = e.changedTouches[0].screenY;
            const diff = touchY - touchstartY;
            if (diff > 0 && sheet.scrollTop <= 0) {
                sheet.style.transform = `translateY(${diff}px)`;
            }
        });

        sheet.addEventListener('touchend', e => {
            const touchY = e.changedTouches[0].screenY;
            const diff = touchY - touchstartY;
            if (diff > 150) {
                // Simulate dismissal
                sheet.style.transform = 'translateY(100%)';
                setTimeout(() => {
                    sheet.style.transform = 'translateY(0)';
                }, 1000);
            } else {
                sheet.style.transform = 'translateY(0)';
            }
        });
    </script>
