<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #4F46E5; /* Indigo background as per prompt */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .logo-container {
            animation: fadeInScale 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .loading-bar {
            width: 140px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .loading-progress {
            width: 40%;
            height: 100%;
            background: white;
            border-radius: 9999px;
            position: absolute;
            animation: loadingMove 2s infinite ease-in-out;
        }

        @keyframes loadingMove {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        .splash-particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center m-0 p-0">
<!-- Atmospheric Shader Background (Subtle motion for premium feel) -->
<div class="fixed inset-0 z-0 opacity-20">

</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-between h-full py-16 px-margin-mobile text-center">
<!-- Spacer for centering logic -->
<div></div>
<!-- Logo and Branding Section -->
<div class="logo-container flex flex-col items-center gap-md">
<!-- Icon Symbol -->
<div class="w-20 h-20 bg-white rounded-lg flex items-center justify-center shadow-xl mb-base transition-transform active:scale-95 duration-300">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    swipe
                </span>
</div>
<!-- Headline String from JSON -->
<h1 class="font-headline-lg-mobile text-white tracking-tighter text-[40px] leading-tight">
                SwipeHire
            </h1>
<!-- Tagline from Prompt -->
<p class="font-body-lg text-white/80 max-w-[200px] leading-relaxed">
                Swipe your way to your next job
            </p>
</div>
<!-- Loading Indicator -->
<div class="flex flex-col items-center gap-sm">
<div class="loading-bar">
<div class="loading-progress"></div>
</div>
<span class="font-label-md text-white/50 tracking-widest uppercase">
                Preparing your deck
            </span>
</div>
</main>
<!-- Floating Atmosphere Elements -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'splash-particle';
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.left = `${Math.random() * 100}vw`;
                
                // Random drift animation
                const duration = Math.random() * 10 + 10;
                particle.animate([
                    { transform: 'translate(0, 0)' },
                    { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)` }
                ], {
                    duration: duration * 1000,
                    iterations: Infinity,
                    direction: 'alternate',
                    easing: 'linear'
                });
                
                body.appendChild(particle);
            }
        });

        // Simple haptic-like interaction on press
        document.body.addEventListener('touchstart', () => {
            document.body.style.transform = 'scale(0.995)';
            document.body.style.transition = 'transform 0.4s cubic-bezier(0.2, 0, 0.2, 1)';
        });
        document.body.addEventListener('touchend', () => {
            document.body.style.transform = 'scale(1)';
        });
    </script>
</body></html>
