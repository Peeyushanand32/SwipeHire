<script>
        // Simple drawer toggle logic
        const menuBtn = document.querySelector('header button:first-child');
        const drawer = document.getElementById('drawer');
        const drawerContent = drawer.querySelector('div:last-child');
        const overlay = drawer.querySelector('div:first-child');

        function toggleDrawer() {
            const isOpen = !drawer.classList.contains('opacity-0');
            if(isOpen) {
                drawerContent.classList.add('-translate-x-full');
                drawer.classList.add('opacity-0');
                drawer.classList.add('pointer-events-none');
            } else {
                drawer.classList.remove('opacity-0');
                drawer.classList.remove('pointer-events-none');
                setTimeout(() => {
                    drawerContent.classList.remove('-translate-x-full');
                }, 10);
            }
        }

        menuBtn.addEventListener('click', toggleDrawer);
        overlay.addEventListener('click', toggleDrawer);

        // Micro-interaction for form completion
        const inputs = document.querySelectorAll('input, textarea, select');
        const progress = document.querySelector('.flex-1.bg-primary');
        
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const filled = Array.from(inputs).filter(i => i.value.length > 0).length;
                const total = inputs.length;
                const percentage = (filled / total) * 100;
                // Just a visual hint, not a full logic
            });
        });

        // Submit intercept
        document.getElementById('job-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Posting...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Published!';
                btn.style.backgroundColor = '#10B981'; // Green success
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.style.backgroundColor = '';
                    btn.classList.remove('opacity-80');
                }, 2000);
            }, 1500);
        });
    </script>
