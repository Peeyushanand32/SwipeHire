<style>
        body {

      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Atmosphere -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute top-[40%] -right-[15%] w-[70%] h-[70%] rounded-full bg-secondary/5 blur-[120px]"></div>

</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[420px] px-margin-mobile z-10 flex flex-col min-h-screen pt-12 pb-8">
<!-- Header Branding -->
<header class="mb-12 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-lg mb-6 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-[32px]">work</span>
</div>
<h1 class="font-headline-xl text-headline-xl tracking-tight mb-2">SwipeHire</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your career move, simplified.</p>
</header>
<!-- Login Form Card -->
<div class="bg-surface-container-lowest rounded-lg p-lg shadow-[0_8px_40px_rgba(26,26,46,0.06)] border border-surface-variant/30 mb-8">
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface ml-base">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-14 pl-[48px] pr-md bg-surface-container-low border-transparent rounded-DEFAULT focus:border-primary focus:ring-0 transition-all font-body-md placeholder:text-outline-variant" placeholder="hello@professional.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<div class="flex justify-between items-center px-base">
<label class="font-label-md text-label-md text-on-surface">Password</label>
<a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-14 pl-[48px] pr-[48px] bg-surface-container-low border-transparent rounded-DEFAULT focus:border-primary focus:ring-0 transition-all font-body-md placeholder:text-outline-variant" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-coral-brand text-white font-headline-md text-headline-md rounded-full shadow-lg shadow-coral-brand/20 active:scale-[0.97] transition-all duration-200 mt-md" type="submit">
                    Log in
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-xl">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="font-label-md text-label-md text-outline">OR</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social Login -->
<button class="w-full h-14 bg-surface border border-outline-variant/50 rounded-full flex items-center justify-center gap-md font-body-lg text-body-lg text-on-surface active:bg-surface-variant/20 transition-all duration-200">
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M23.49 12.275c0-.825-.075-1.616-.214-2.375H12v4.5h6.44c-.279 1.5-1.125 2.775-2.39 3.621v3h3.864c2.261-2.083 3.576-5.146 3.576-8.746Z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.955-1.075 7.941-2.914l-3.864-3c-1.071.716-2.441 1.139-4.077 1.139-3.135 0-5.786-2.119-6.733-4.964H1.321v3.093A11.997 11.997 0 0 0 12 24Z" fill="#34A853"></path>
<path d="M5.267 14.261c-.24-.716-.377-1.482-.377-2.261s.137-1.545.377-2.261V6.646H1.321A11.992 11.992 0 0 0 0 12c0 1.916.45 3.727 1.251 5.334l3.945-3.073h.071Z" fill="#FBBC05"></path>
<path d="M12 4.773c1.764 0 3.346.607 4.59 1.8l3.441-3.441C17.95 1.192 15.235 0 12 0 7.311 0 3.26 2.69 1.321 6.646l3.946 3.073c.947-2.845 3.598-4.946 6.733-4.946Z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
<!-- Footer Signup -->
<footer class="mt-auto text-center pb-8">
<p class="font-body-md text-body-md text-on-surface-variant">
                New here? 
                <a class="text-primary font-bold hover:underline underline-offset-4" href="#">Sign up</a>
</p>
</footer>
</main>
<!-- Contextual Aesthetic Element (Blurred Card Stack) -->
<div class="fixed -bottom-10 right-10 w-48 h-64 bg-white/20 rounded-lg -rotate-12 border border-white/30 backdrop-blur-sm -z-10 opacity-50 hidden sm:block"></div>
<div class="fixed -bottom-4 right-20 w-48 h-64 bg-white/40 rounded-lg -rotate-6 border border-white/40 backdrop-blur-md -z-10 opacity-70 hidden sm:block"></div>
<script>
        // Micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.02]');
                input.parentElement.classList.add('shadow-md');
                input.parentElement.style.transition = 'all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.02]');
                input.parentElement.classList.remove('shadow-md');
            });
        });

        // Toggle Password Visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('input[type="password"]');
        if(toggleBtn && passInput) {
            toggleBtn.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                toggleBtn.children[0].innerText = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
</body></html>
