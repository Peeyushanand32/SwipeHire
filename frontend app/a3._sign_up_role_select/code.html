<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Sign Up | SwipeHire</title>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf8ff;
            color: #1a1a2e;
            -webkit-font-smoothing: antialiased;
        }

        .role-card.active {
            border-color: #3525cd;
            background-color: #efecff;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(26, 26, 46, 0.08);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Smooth focus transition for inputs */
        .input-focus-ring:focus {
            outline: none;
            border-color: #3525cd;
            box-shadow: 0 0 0 4px rgba(53, 37, 205, 0.1);
        }

        .button-press:active {
            transform: scale(0.96);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-start overflow-x-hidden">
<!-- TopAppBar suppression logic applied: Hidden for transactional flow -->
<main class="w-full max-w-md px-margin-mobile pt-12 pb-xl flex flex-col gap-lg">
<!-- Header Section -->
<header class="text-center space-y-xs">
<h1 class="font-headline-xl text-headline-xl text-on-background tracking-tight">Create your account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Let's get you started with SwipeHire.</p>
</header>
<!-- Role Selection -->
<section class="flex flex-col gap-md">
<h2 class="font-label-md text-label-md text-outline uppercase tracking-widest">I WANT TO...</h2>
<div class="grid grid-cols-2 gap-md">
<!-- Job Seeker Tile -->
<button class="role-card group flex flex-col items-center justify-center p-lg bg-surface-container-lowest border-2 border-transparent rounded-lg transition-all duration-300 text-center gap-sm" id="role-seeker" onclick="selectRole('seeker')">
<div class="w-12 h-12 rounded-full bg-secondary-container/10 flex items-center justify-center text-secondary group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-colors">
<span class="material-symbols-outlined text-[28px]">search</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Find a job</span>
</button>
<!-- Recruiter Tile -->
<button class="role-card group flex flex-col items-center justify-center p-lg bg-surface-container-lowest border-2 border-transparent rounded-lg transition-all duration-300 text-center gap-sm" id="role-recruiter" onclick="selectRole('recruiter')">
<div class="w-12 h-12 rounded-full bg-secondary-container/10 flex items-center justify-center text-secondary group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-colors">
<span class="material-symbols-outlined text-[28px]">work</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Hire talent</span>
</button>
</div>
</section>
<!-- Form Fields -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="full_name">Full Name</label>
<input class="w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-md px-md font-body-lg text-body-lg input-focus-ring transition-all placeholder:text-outline-variant" id="full_name" placeholder="John Doe" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<input class="w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-md px-md font-body-lg text-body-lg input-focus-ring transition-all placeholder:text-outline-variant" id="email" placeholder="john@example.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="phone">Phone Number</label>
<input class="w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-md px-md font-body-lg text-body-lg input-focus-ring transition-all placeholder:text-outline-variant" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-md px-md font-body-lg text-body-lg input-focus-ring transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="button-press mt-md h-14 w-full bg-brand-coral text-white font-headline-md text-headline-md rounded-full shadow-lg shadow-brand-coral/20 hover:opacity-90 transition-all duration-200" type="submit">
                Create account
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md py-sm">
<div class="h-[1px] flex-grow bg-outline-variant"></div>
<span class="font-label-md text-label-md text-outline">OR</span>
<div class="h-[1px] flex-grow bg-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="button-press flex items-center justify-center gap-md w-full h-14 bg-white border border-outline-variant rounded-full font-body-lg text-body-lg text-on-surface hover:bg-surface-container transition-all">
<svg class="w-6 h-6" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<!-- Footer Link -->
<footer class="text-center pt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</footer>
</main>
<!-- BottomNavBar suppression logic applied: Hidden for focused sign-up flow -->
<script>
        function selectRole(role) {
            // Remove active class from all cards
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // Add active class to selected card
            const selectedCard = document.getElementById(`role-${role}`);
            selectedCard.classList.add('active');
            
            // Interaction feedback
            console.log(`Role selected: ${role}`);
        }

        // Initialize with job seeker active by default
        window.onload = () => selectRole('seeker');
    </script>
</body></html>
