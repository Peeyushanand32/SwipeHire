<!-- Micro-interaction Scripts -->
<script>
        const bottomSheet = document.getElementById('bottomSheet');
        const overlay = document.getElementById('overlay');
        
        // Simple drag interaction simulation
        let startY = 0;
        let currentY = 0;
        
        bottomSheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            bottomSheet.style.transition = 'none';
        });

        bottomSheet.addEventListener('touchmove', (e) => {
            currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;
            if (deltaY > 0) {
                bottomSheet.style.transform = `translateY(${deltaY}px)`;
                overlay.style.opacity = Math.max(0, 1 - (deltaY / 400));
            }
        });

        bottomSheet.addEventListener('touchend', () => {
            const deltaY = currentY - startY;
            bottomSheet.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease';
            
            if (deltaY > 150) {
                // Close sheet logic (simulated)
                bottomSheet.style.transform = 'translateY(100%)';
                overlay.style.opacity = '0';
                setTimeout(() => overlay.classList.add('hidden'), 300);
            } else {
                // Snap back
                bottomSheet.style.transform = 'translateY(0)';
                overlay.style.opacity = '1';
            }
        });

        // Click overlay to "close"
        overlay.addEventListener('click', () => {
            bottomSheet.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            bottomSheet.style.transform = 'translateY(100%)';
            overlay.style.opacity = '0';
            setTimeout(() => overlay.classList.add('hidden'), 400);
        });

        // Dynamic Chip Interaction
        document.querySelectorAll('label').forEach(chip => {
            chip.addEventListener('click', () => {
                const cb = chip.querySelector('input');
                if(!cb.checked) {
                    chip.classList.add('scale-95');
                    setTimeout(() => chip.classList.remove('scale-95'), 100);
                }
            });
        });
    </script>
