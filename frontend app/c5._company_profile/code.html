<main class="pt-20 px-margin-mobile max-w-2xl mx-auto">

</div>
<div class="absolute -bottom-2 -right-2 bg-primary text-on-primary p-1.5 rounded-full shadow-md">
<span class="material-symbols-outlined text-[18px]">add_a_photo</span>

<!-- Editable Details Form -->

</div>
<!-- City -->
<div class="group">
<label class="block font-label-md text-on-surface-variant mb-xs ml-base">Headquarters City</label>

<span class="material-symbols-outlined">save</span>
                    Save changes
                </button>

</a>

<div class="bg-primary/10 px-4 py-1 rounded-full flex flex-col items-center">

<!-- Overlay Decoration / Atmosphere -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-primary/5 rounded-full blur-[100px]"></div>
<div class="fixed bottom-32 left-0 -z-10 w-80 h-80 bg-secondary/5 rounded-full blur-[120px]"></div>
<script>
        // Micro-interaction for input fields
        document.querySelectorAll('input, textarea').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Simple button active state simulation
        const saveBtn = document.querySelector('button.bg-\\[\\#FF7F50\\]');
        saveBtn.addEventListener('click', function() {
            const originalText = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Saving...';
            this.disabled = true;
            this.style.opacity = '0.8';
            
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Changes Saved';
                this.style.backgroundColor = '#10b981'; // Green success
                
                setTimeout(() => {
                    this.innerHTML = originalText;
                    this.style.backgroundColor = '#FF7F50';
                    this.disabled = false;
                    this.style.opacity = '1';
                }, 2000);
            }, 1200);
        });
    </script>
</body></html>
